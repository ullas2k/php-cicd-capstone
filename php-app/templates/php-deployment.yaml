apiVersion: apps/v1
kind: Deployment
metadata:
  name: php-app

spec:
  replicas: 2

  selector:
    matchLabels:
      app: php

  template:
    metadata:
      labels:
        app: php

    spec:
      imagePullSecrets:
        - name: ecr-secret
      containers:
      - name: php
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"

        ports:
        - containerPort: 80

        env:
        - name: DB_HOST
          valueFrom:
            configMapKeyRef:
              name: php-config
              key: DB_HOST

        - name: DB_NAME
          valueFrom:
            configMapKeyRef:
              name: php-config
              key: DB_NAME

        - name: DB_USER
          value: root

        - name: DB_PASS
          valueFrom:
            secretKeyRef:
              name: mysql-secret
              key: MYSQL_ROOT_PASSWORD
